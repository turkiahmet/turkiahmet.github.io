name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node for private admin checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify private admin safeguards
        run: |
          node admin-backend/build.mjs
          node --check admin-backend/worker.js
          node --test admin-backend/test.mjs admin-backend/notification-script.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate academic pages
        run: python3 tools/build_site.py
      - name: Prepare public CV generation
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core
          python3 -m pip install --user reportlab arabic-reshaper python-bidi
      - name: Generate public CV PDFs
        run: python3 tools/build_cv_pdfs.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

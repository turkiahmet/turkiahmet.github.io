name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Import reviewed website source once
        shell: python
        run: |
          import base64, hashlib, io, pathlib, stat, subprocess, zipfile
          root = pathlib.Path('site')
          if not (root / 'index.html').exists():
              payload = base64.b64decode('', validate=True)
              if hashlib.sha256(payload).hexdigest() != 'da2273a18197e89755f4d0110592f86cfd4cd4b1d529d214b27f0437cac43f10':
                  raise RuntimeError('Website archive checksum mismatch')
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  if archive.testzip() is not None:
                      raise RuntimeError('Website archive CRC failed')
                  for info in archive.infolist():
                      path = pathlib.PurePosixPath(info.filename)
                      if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(info.external_attr >> 16):
                          raise RuntimeError('Unsafe archive member')
                  archive.extractall(root)
              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'site'], check=True)
              subprocess.run(['git', 'commit', '-m', 'Add multilingual academic website source'], check=True)
              subprocess.run(['git', 'push'], check=True)
          else:
              print('Using website source already committed in site/.')
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
